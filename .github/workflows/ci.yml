name: Portfolio checks

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate project and publication helper
        run: |
          npm run test:publication
          npm run test:starter
          npm run validate:content
          npm run typecheck
          npm run test:portfolio
      - name: Build preview for browser verification
        run: npm run build
        env:
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ci-public-placeholder-no-real-submissions
          PORTFOLIO_INDEXABLE: 'false'
      - run: npx playwright install --with-deps chromium
      - name: Verify browser behavior and export
        run: |
          npm run test:e2e
          npm run test:smoke
      - name: Verify configurable showcase, video and poster previews
        run: npm run test:media
